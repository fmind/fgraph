version: "2"
run:
  go: "1.27"
  tests: true
  timeout: 10m
  concurrency: 0
  issues-exit-code: 1
  enable-build-vcs: false
  relative-path-mode: cfg
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes: ["github.com/fmind/fgraph/go"]
linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gosec
    - misspell
    - perfsprint
    - prealloc
    - revive
    - sloglint
    - sqlclosecheck
    - testifylint
    - unparam
    - unused
    - whitespace
  settings:
    govet:
      enable-all: true
    errcheck:
      check-type-assertions: true
      check-blank: true
    gosec:
      severity: medium
      confidence: medium
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    misspell:
      locale: US
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
