name: Pages
on:
  push:
    branches: [main]
    paths: ["docs/**", "mise.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:
# Default to read-only; only the deploy job widens what it actually needs.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false # let a running deploy finish before starting the next
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUGO_ENVIRONMENT: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so enableGitInfo renders last-modified dates
          persist-credentials: false # the build never pushes; deploy authenticates via OIDC
      - name: Install tools using mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.8.14
          install_args: go hugo-extended
          cache: false
      - name: Download Hugo modules
        run: mise run install:docs
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the site
        # Same task as local builds; only the base URL comes from the Pages setup.
        # Passed through env, not expanded inline: GitHub substitutes ${{ }} before
        # the shell sees the script, so an inline expansion is a code-injection path.
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: mise run build:docs -- --baseURL "$PAGES_BASE_URL/"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write # publish the uploaded artifact to GitHub Pages
      id-token: write # mint the OIDC token deploy-pages exchanges
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
