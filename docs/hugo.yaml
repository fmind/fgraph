baseURL: https://fmind.github.io/fgraph/
locale: en-us
title: fgraph

# Fail builds on missing pages/refs instead of silently emitting broken links.
refLinksErrorLevel: ERROR

enableGitInfo: true # last-modified dates from git (Hextra shows them in the footer)

# Keep the documentation source flat so Hextra renders one peer-level sidebar. Public routes
# remain under /docs/, while Overview explicitly owns the section landing route.
permalinks:
  - pattern: /docs/:contentbasename/
    target:
      kind: page
      path: /**

module:
  hugoVersion:
    extended: true
    min: "0.165.0"
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true # allow inline HTML in Markdown (required by some Hextra shortcodes)
  highlight:
    noClasses: false # use CSS classes so Hextra's dark/light themes style code blocks

menu:
  main:
    - name: Search
      weight: 1
      params:
        type: search
    - name: GitHub
      weight: 2
      url: https://github.com/fmind/fgraph
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
  page:
    width: normal
  footer:
    displayCopyright: true
  editURL:
    enable: true
    base: https://github.com/fmind/fgraph/edit/main/docs/content
  search:
    enable: true
    type: flexsearch # client-side search, no external service
